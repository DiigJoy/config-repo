server:
  port: 8086

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**
        - id: plan-service
          uri: lb://plan-service
          predicates:
            - Path=/plans/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notificaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka
